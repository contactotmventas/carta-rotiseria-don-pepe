<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Don Pepe — Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --azul:#a69b9b; --azulo:#6c6565; --tinta:#f0f005; --suave:#f0f005;
         --papel:#14171A; --papel-rgb:20,23,26;
         --fcuerpo:'Lora',Georgia,serif; --ftitulo:'Playfair Display',Georgia,serif; --tf:0.68; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:var(--fcuerpo);
    color:var(--tinta);
    background:#14171A;
    min-height:100vh;
    padding-bottom:30px;
  }
  .wrap{ max-width:560px; margin:0 auto; padding:0 22px; }

  header.hero{ text-align:center; padding:30px 0 10px; }
  .marca{
    width:96px;height:96px;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle at 35% 30%, #d7d2d2, #a69b9b 90%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 22px rgba(0,0,0,.28);
  }
  .marca b{ font-family:var(--fcuerpo);font-weight:800;color:#fff;font-size:42px;letter-spacing:-2px; }
  .marca-img{ width:100%;height:100%;border-radius:50%;object-fit:cover; }
  .hero h1{
    font-family:var(--ftitulo);font-weight:700;color:var(--azul);
    font-size:calc(46px * var(--tf));line-height:1;
  }
  .hero p{ color:var(--suave);opacity:.7;font-size:13px;margin-top:6px;letter-spacing:.5px; }

  /* Próximos eventos */
  .eventos{
    margin:6px 18px 18px;
    padding:18px 16px;
    background:linear-gradient(135deg, rgba(43,201,222,.12), rgba(180,41,201,.10));
    border:1.5px solid rgba(46,90,134,.25);
    border-radius:16px;
  }
  .ev-cabecera{
    text-align:center;font-family:var(--ftitulo);font-weight:700;
    color:var(--azul);font-size:calc(28px * var(--tf));margin-bottom:12px;line-height:1.05;
  }
  .ev-item{
    padding:10px 0;
    border-top:1px dashed rgba(46,90,134,.25);
  }
  .ev-item:first-of-type{ border-top:none; }
  .ev-fecha{
    font-family:var(--fcuerpo);font-weight:700;font-size:12px;
    color:#B429C9;text-transform:capitalize;letter-spacing:.3px;
  }
  .ev-titulo{
    font-family:var(--ftitulo);font-weight:700;
    color:var(--azul);font-size:calc(24px * var(--tf));line-height:1.1;margin-top:1px;
  }
  .ev-detalle{ font-size:14px;color:var(--suave);opacity:.8;margin-top:2px; }

  nav.chips{
    position:sticky;top:0;z-index:10;
    display:flex;gap:8px;overflow-x:auto;padding:12px 22px;
    background:rgba(var(--papel-rgb),.92);backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(46,90,134,.18);
    scrollbar-width:none;
  }
  nav.chips::-webkit-scrollbar{ display:none; }
  .navchip{
    white-space:nowrap;border:1.5px solid var(--azul);background:transparent;
    color:var(--azul);font-weight:600;font-size:13px;padding:7px 15px;border-radius:999px;
    cursor:pointer;text-transform:capitalize;
  }
  .navchip:active{ background:var(--azul);color:#fff; }

  .pagina{ padding:26px 0 8px; scroll-margin-top:64px; }
  .titulo{
    font-family:var(--ftitulo);font-weight:700;color:var(--azul);
    font-size:calc(42px * var(--tf));line-height:1.05;margin-bottom:6px;
  }
  .titulo .punto{ color:var(--azul); }
  .sub{
    font-family:var(--fcuerpo);font-weight:800;color:var(--azulo);
    font-size:17px;letter-spacing:1px;margin:20px 0 4px;
    display:inline-block;
  }
  .sub::after{
    content:"";display:block;height:3px;width:100%;margin-top:3px;
    background:var(--azul);border-radius:2px;opacity:.85;
  }
  .nota{
    color:var(--suave);opacity:.78;font-size:12.5px;font-style:italic;
    margin:2px 0 8px;line-height:1.4;
  }
  .filas{ margin-top:6px; }
  .fila{ display:flex;align-items:flex-end;gap:6px;padding:5px 0; }
  .fnom{ display:flex;flex-direction:column;min-width:0;flex:0 1 auto; }
  .nom{ font-weight:700;font-size:14.5px;color:var(--tinta);text-transform:uppercase;letter-spacing:.2px;line-height:1.15; }
  .desc{ font-weight:400;font-size:12px;color:var(--tinta);opacity:.66;text-transform:none;letter-spacing:0;margin-top:1px; }
  .dots{ flex:1;border-bottom:2px dotted var(--azul);opacity:.5;transform:translateY(-4px);min-width:18px; }
  .precio{ font-weight:800;font-size:15px;color:var(--azul);white-space:nowrap; }
  .fila.agotado .nom{ color:var(--tinta);opacity:.45;text-decoration:line-through; }
  .fila.agotado .precio{ color:var(--tinta);opacity:.35; }
  .ag{ font-size:10px;background:#C0455A;color:#fff;padding:1px 6px;border-radius:6px;vertical-align:middle;text-decoration:none;display:inline-block;letter-spacing:.5px; }

  .ig{ text-align:center;font-family:var(--ftitulo);font-size:calc(22px * var(--tf));color:var(--azul);opacity:.8;padding:24px 0 6px; }

  @media (prefers-reduced-motion: no-preference){
    .pagina{ animation:sube .5s both; }
    @keyframes sube{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
  }

  /* ---- Portada con los 3 botones ---- */
  .portada{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:30px;
    background:linear-gradient(160deg,#0B1117 0%,#6c6565 55%,#a69b9b 100%);
    background-size:cover; background-position:center;
  }
  .portada-cap{
    background:rgba(15,25,40,.42); backdrop-filter:blur(3px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:26px; padding:40px 28px; max-width:430px; width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  .port-tit{ font-family:var(--fcuerpo);font-weight:800;color:#fff;font-size:30px;letter-spacing:-1px;margin-top:10px;line-height:1.1; }
  .port-sub{ color:rgba(255,255,255,.82);font-size:12px;letter-spacing:4px;margin-bottom:30px; }
  .port-botones{ display:flex;flex-direction:column;gap:14px; }
  .port-btn{
    font-family:var(--fcuerpo);font-weight:700;font-size:18px;
    padding:18px 16px;border:none;border-radius:16px;cursor:pointer;
    background:#fff;color:#1E3F61;
    box-shadow:0 6px 20px rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .12s ease;
  }
  .port-btn:active{ transform:scale(.96); }
  .port-btn span{ font-size:22px; }
  .volver{
    position:sticky;top:0;z-index:20;width:100%;display:block;
    background:var(--azulo);color:#fff;border:none;padding:13px;
    font-family:var(--fcuerpo);font-weight:600;font-size:14px;cursor:pointer;letter-spacing:.3px;
  }
  .volver:active{ filter:brightness(1.15); }
  .marca.chica{ width:62px;height:62px;margin-bottom:10px; }
  .marca.chica b{ font-size:27px; }

  /* ---- Carta del Bar: fotos oficiales ---- */
  .fotos-wrap{ max-width:560px; margin:0 auto; background:var(--papel); }
  .foto-carta{ display:block; width:100%; height:auto; }

  /* ---- Pie de marca: "menú digital por TM Ventas" ---- */
  .tm-pie{
    margin-top:30px; padding:18px 12px 22px;
    background:#0B1117; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .tm-pie .tm-logo{ height:30px; width:auto; opacity:.96; }
  .tm-pie span{
    font-family:var(--fcuerpo); font-size:10.5px; letter-spacing:2px;
    text-transform:uppercase; color:#7de8a6; opacity:.85;
  }

    .mozo-fab{position:fixed;right:14px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .mozo-btn{border:0;border-radius:999px;padding:14px 20px;font:600 15px/1 system-ui,sans-serif;color:#fff;
      background:#1d7a4d;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;gap:8px}
    .mozo-btn.sec{background:#2b3a46;font-size:14px;padding:11px 16px}
    .mozo-btn:disabled{opacity:.55}
    .mozo-ok{background:#0f5132}
    .mozo-msg{background:#fff;color:#123;border-radius:12px;padding:10px 14px;font:500 13.5px/1.35 system-ui,sans-serif;
      box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:250px;display:none}
    .mozo-mesa{font:500 12px/1 system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:5px 10px}

    .ped-fab{position:fixed;left:14px;bottom:16px;z-index:61}
    .ped-btn{border:0;border-radius:999px;padding:14px 20px;font:600 15px/1 system-ui,sans-serif;color:#fff;
      background:#b8430f;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;gap:8px}
    .ped-cap{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
    .ped-cap.on{display:flex}
    .ped-box{background:#fff;color:#1b2430;width:100%;max-width:520px;max-height:92vh;overflow:auto;
      border-radius:18px 18px 0 0;padding:16px 16px 22px;font-family:system-ui,-apple-system,sans-serif}
    @media(min-width:560px){ .ped-cap{align-items:center} .ped-box{border-radius:18px} }
    .ped-box h2{margin:2px 0 10px;font-size:19px}
    .ped-cerrar{float:right;border:0;background:#eef1f4;border-radius:999px;width:32px;height:32px;font-size:18px;cursor:pointer;color:#48525c}
    .ped-buscar{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d5dbe1;border-radius:10px;font-size:16px;margin-bottom:8px}
    .ped-lista{max-height:34vh;overflow:auto;border:1px solid #e6eaee;border-radius:10px;margin-bottom:10px}
    .ped-it{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #f0f2f5}
    .ped-it:last-child{border-bottom:0}
    .ped-it .nm{flex:1;min-width:0;font-size:14px}
    .ped-it .pr{font-size:13px;color:#5b6672;white-space:nowrap}
    .ped-it button{border:0;background:#1d7a4d;color:#fff;border-radius:8px;width:30px;height:30px;font-size:17px;cursor:pointer}
    .ped-car{background:#f6f8fa;border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
    .ped-car .rg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
    .ped-car .rg button{border:0;background:#e2e6ea;border-radius:6px;width:24px;height:24px;cursor:pointer;color:#48525c}
    .ped-tot{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid #dde2e7;margin-top:6px;padding-top:6px}
    .ped-f{display:block;margin-bottom:8px}
    .ped-f span{display:block;font-size:12.5px;color:#5b6672;margin-bottom:3px}
    .ped-f input,.ped-f select,.ped-f textarea{width:100%;box-sizing:border-box;padding:11px 12px;
      border:1px solid #d5dbe1;border-radius:10px;font-size:16px;font-family:inherit}
    .ped-enviar{width:100%;border:0;border-radius:12px;padding:15px;font:700 16px/1 system-ui,sans-serif;color:#fff;background:#b8430f;cursor:pointer}
    .ped-enviar:disabled{opacity:.55}
    .ped-aviso{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;display:none}
    .ped-aviso.err{background:#fdecec;color:#8f2020;display:block}
    .ped-aviso.ok{background:#e8f6ee;color:#14663c;display:block}
    .ped-alias{background:#eef4ff;border:1px solid #cfdcf7;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;color:#1d3a63}
    .ped-alias b{font-size:16px;display:block;margin:3px 0;word-break:break-all}
    .ped-alias button{border:0;background:#1d3a63;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
    .ped-gratis{color:#14663c;font-weight:600}
</style>
</head>
<body>

    <div class="mozo-fab">
      <div class="mozo-msg" id="mozoMsg"></div>
      <span class="mozo-mesa" id="mozoMesa" style="display:none"></span>
      <button class="mozo-btn sec" id="mozoCuenta" onclick="llamar('cuenta')">🧾 Pedir la cuenta</button>
      <button class="mozo-btn" id="mozoMozo" onclick="llamar('mozo')">🔔 Llamar al mozo</button>
    </div>

    <div class="ped-fab"><button class="ped-btn" onclick="pedAbrir()"><span>&#128757;</span> Pedir a domicilio</button></div>
    <div class="ped-cap" id="pedCap" onclick="if(event.target===this)pedCerrar()">
      <div class="ped-box">
        <button class="ped-cerrar" onclick="pedCerrar()">&times;</button>
        <h2>Tu pedido</h2>
        <div class="ped-aviso" id="pedAviso"></div>
        <div id="pedPaso1">
          <input class="ped-buscar" id="pedBuscar" placeholder="Busc&aacute; un producto&hellip;" oninput="pedPintar()">
          <div class="ped-lista" id="pedLista"></div>
          <div class="ped-car" id="pedCarro"></div>
          <label class="ped-f"><span>Tu nombre *</span><input id="pedNombre" autocomplete="name"></label>
          <label class="ped-f"><span>Tu tel&eacute;fono (WhatsApp) *</span><input id="pedTel" inputmode="tel" autocomplete="tel"></label>
          <label class="ped-f"><span>&iquest;C&oacute;mo lo quer&eacute;s?</span>
            <select id="pedEntrega" onchange="pedPintar()">
              <option value="envio">Que me lo lleven</option>
              <option value="retira">Lo paso a buscar</option>
            </select></label>
          <div id="pedEnvio">
            <label class="ped-f"><span>Direcci&oacute;n *</span><input id="pedDir" placeholder="Calle 1234, timbre 2" autocomplete="street-address"></label>
            
          </div>
          <label class="ped-f"><span>&iquest;C&oacute;mo pag&aacute;s?</span>
            <select id="pedPago" onchange="pedPintar()">
              <option value="efectivo">Efectivo</option>
              <option value="transferencia">Transferencia</option>
              <option value="tarjeta">Tarjeta (llev&aacute; el posnet)</option>
            </select></label>
          <div id="pedPagoExtra"></div>
          <label class="ped-f"><span>Aclaraciones (opcional)</span><textarea id="pedNota" rows="2" placeholder="sin sal, timbre roto&hellip;"></textarea></label>
          <button class="ped-enviar" id="pedEnviarBtn" onclick="pedEnviar()">Mandar el pedido</button>
        </div>
      </div>
    </div>

  // La mesa vale SOLO si viene en la direccion, o sea si se escaneo el QR de esa
  // mesa. Antes quedaba guardada en el telefono para siempre: el que abria la
  // carta que le mandaron por WhatsApp veia "Mesa 4" desde su casa, y -mucho
  // peor- el cliente que ayer se sento en la 4 y hoy esta en la 9 llamaba al
  // mozo A LA MESA EQUIVOCADA.
  function mesaDelQR(){
    // El buzon limpia el numero igual que aca, asi lo que se ve en pantalla es
    // exactamente lo que le llega al mozo.
    try{ return String(new URLSearchParams(location.search).get("mesa") || "").replace(/[^0-9A-Za-z- ]/g,"").slice(0,10).trim(); }
    catch(e){ return ""; }
  }
  // NO se guarda ningun numero de mesa en el telefono. Se probo hacerlo y es
  // peor: al que abria la carta sin QR le aparecia el numero de la otra vez ya
  // escrito, tocaba "Aceptar" sin leer, y el mozo iba a la mesa equivocada.
  function mostrarMesa(){
    // El cartelito de la mesa solo se muestra si se escaneo el QR de la mesa.
    var m = mesaDelQR(), el = document.getElementById("mozoMesa");
    if (!el) return;
    if (m) { el.textContent = "Mesa " + m; el.style.display = "inline-block"; }
    else { el.textContent = ""; el.style.display = "none"; }
  }
  function mozoAviso(txt, ms){
    var el = document.getElementById("mozoMsg");
    if (!el) return;
    el.textContent = txt; el.style.display = "block";
    clearTimeout(window._mozoT);
    window._mozoT = setTimeout(function(){ el.style.display = "none"; }, ms || 4500);
  }
  function llamar(tipo){
    var mesa = mesaDelQR();
    if (!mesa) {
      var escrito = null;
      // El casillero arranca VACIO a proposito: que lo escriba quien esta sentado.
      try{ escrito = prompt("¿En qué mesa estás? Escribí el número:", ""); }catch(e){ escrito = null; }
      mesa = String(escrito == null ? "" : escrito).replace(/[^0-9A-Za-z- ]/g,"").slice(0,10).trim();
      if (!mesa) {
        // Si se arrepintio o el navegador bloqueo la pregunta, se lo dice: antes
        // el boton no hacia nada y el cliente tocaba cinco veces al pedo.
        mozoAviso(escrito === null
          ? "Para avisarle al mozo necesito saber en qué mesa estás. Escaneá el QR de tu mesa."
          : "Escribí el número de tu mesa para poder avisarle al mozo.", 6000);
        return;
      }
      var elm = document.getElementById("mozoMesa");
      if (elm) { elm.textContent = "Mesa " + mesa; elm.style.display = "inline-block"; }
    }
    var b = document.getElementById(tipo === "cuenta" ? "mozoCuenta" : "mozoMozo");
    var textoOriginal = b ? b.innerHTML : "";
    if (b) { b.disabled = true; b.innerHTML = "Avisando…"; }
    fetch(MOZO_URL + "/llamar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ local: MOZO_LOCAL, mesa: mesa, tipo: tipo })
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok) {
        if (b) { b.classList.add("mozo-ok"); b.innerHTML = "✓ Avisado"; }
        mozoAviso(tipo === "cuenta" ? "Listo, ya avisamos que pedís la cuenta." : "Listo, el mozo ya fue avisado. Ahí va.");
        setTimeout(function(){ if (b) { b.disabled = false; b.classList.remove("mozo-ok"); b.innerHTML = textoOriginal; } }, 30000);
      } else if (j && j.error === "demasiados-llamados") {
        if (b) { b.disabled = false; b.innerHTML = textoOriginal; }
        mozoAviso("Hubo muchos llamados seguidos. Esperá un momento o avisale a un mozo.");
      } else {
        if (b) { b.disabled = false; b.innerHTML = textoOriginal; }
        mozoAviso("No pudimos avisar desde acá. Llamá a un mozo con la mano.");
      }
    }).catch(function(){
      if (b) { b.disabled = false; b.innerHTML = textoOriginal; }
      mozoAviso("Sin conexión para avisar. Llamá a un mozo con la mano.");
    });
  }
  mostrarMesa();

  var PED_URL = "https://buzon-tmventas.contacto-tmventas.workers.dev", PED_LOCAL = "714sb3rgzg6aqio9x9";
  var PED_LOCALNOM = "Don Pepe";
  var PED_PROD = [{"n":"hamburguesa","p":3000},{"n":"burrito","p":2000},{"n":"pizza","p":11000}], PED_ZONAS = [];
  var PED_ENVIO_DEF = 1000, PED_GRATIS_DESDE = 0;
  var PED_ALIAS = "donpepe";
  var pedCarro = {};
  function pedAbrir(){
    // Si el cartel quedo en "listo" de un pedido anterior, se vuelve a armar el
    // formulario: antes, el que se acordaba de las bebidas abria de nuevo y se
    // encontraba con la pantalla vacia, y esa venta se perdia.
    var paso1 = document.getElementById("pedPaso1");
    if (paso1 && paso1.style.display === "none") {
      paso1.style.display = "block";
      pedCarro = {}; _pedPagoPintado = null;
      pedAviso("");
      var b = document.getElementById("pedEnviarBtn");
      if (b) { b.disabled = false; b.textContent = "Mandar el pedido"; }
    }
    document.getElementById("pedCap").classList.add("on");
    pedPintar();
  }
  function pedCerrar(){ document.getElementById("pedCap").classList.remove("on"); }
  function pedAviso(t, tipo){
    var e = document.getElementById("pedAviso");
    e.textContent = t || "";
    e.className = "ped-aviso" + (t ? " " + (tipo || "err") : "");
  }
  function pedNorm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
  function pedEsc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function pedMas(i, d){
    var n = PED_PROD[i] ? PED_PROD[i].n : null; if (!n) return;
    pedCarro[n] = Math.max(0, (pedCarro[n]||0) + d);
    if (!pedCarro[n]) delete pedCarro[n];
    pedPintar();
  }
  function pedIndice(n){ for (var i=0;i<PED_PROD.length;i++) if (PED_PROD[i].n===n) return i; return -1; }
  function pedPrecio(n){ for (var i=0;i<PED_PROD.length;i++) if (PED_PROD[i].n===n) return PED_PROD[i].p; return 0; }
  function pedSubtotal(){
    var t = 0;
    for (var n in pedCarro) t += pedPrecio(n) * pedCarro[n];
    return t;
  }
  // EXACTAMENTE la misma cuenta que hace la computadora del comercio:
  //   sin envio -> 0
  //   pasa el minimo de envio gratis -> 0
  //   la zona tiene precio propio -> ese
  //   si no -> el envio de siempre del comercio
  function pedEnvioActual(){
    if (document.getElementById("pedEntrega").value !== "envio") return 0;
    if (PED_GRATIS_DESDE > 0 && pedSubtotal() >= PED_GRATIS_DESDE) return 0;
    var s = document.getElementById("pedZona");
    if (s && s.value) {
      for (var i=0;i<PED_ZONAS.length;i++) if (PED_ZONAS[i].id===s.value && PED_ZONAS[i].envio > 0) return PED_ZONAS[i].envio;
    }
    return PED_ENVIO_DEF;
  }
  var _pedPagoPintado = null;
  function pedPintarPago(){
    var sel = document.getElementById("pedPago"), caja = document.getElementById("pedPagoExtra");
    if (!sel || !caja) return;
    var v = sel.value, total = pedSubtotal() + pedEnvioActual();
    // Se vuelve a dibujar SOLO si cambio la forma de pago. Antes se redibujaba
    // en cada toque (agregar un producto, cambiar la zona) y le borraba al
    // cliente el monto con el que iba a pagar: el repartidor salia sin vuelto.
    if (_pedPagoPintado === v) {
      var inp = document.getElementById("pedVuelto");
      if (inp && total > 0) inp.placeholder = "ej: " + Math.round(Math.ceil((total+1)/1000)*1000);
      return;
    }
    _pedPagoPintado = v;
    if (v === "transferencia") {
      caja.innerHTML = PED_ALIAS
        ? '<div class="ped-alias">Transfer&iacute; a este alias y mand&aacute; el comprobante por WhatsApp:<b id="pedAliasTxt">'+pedEsc(PED_ALIAS)+'</b>'+
          '<button type="button" onclick="pedCopiarAlias()">Copiar el alias</button></div>'
        : '<div class="ped-alias">Cuando confirmemos el pedido te pasamos los datos para la transferencia.</div>';
    } else if (v === "efectivo") {
      caja.innerHTML = '<label class="ped-f"><span>&iquest;Con cu&aacute;nto pag&aacute;s? (para llevarte el vuelto)</span>'+
        '<input id="pedVuelto" inputmode="numeric" placeholder="'+(total>0?"ej: "+Math.round(Math.ceil((total+1)/1000)*1000):"ej: 20000")+'"></label>';
    } else {
      caja.innerHTML = '<div class="ped-alias">El repartidor va con el posnet. Si no llega a andar la se&ntilde;al, tené efectivo a mano.</div>';
    }
  }
  function pedCopiarAlias(){
    try{ navigator.clipboard.writeText(PED_ALIAS); pedAviso("Alias copiado.", "ok"); }
    catch(e){ pedAviso("Copialo a mano: " + PED_ALIAS, "ok"); }
  }
  function pedPintar(){
    var q = pedNorm((document.getElementById("pedBuscar")||{}).value);
    var lista = document.getElementById("pedLista");
    var h = "", puestos = 0;
    for (var i=0;i<PED_PROD.length && puestos<60;i++){
      var p = PED_PROD[i];
      if (q && pedNorm(p.n).indexOf(q) < 0) continue;
      puestos++;
      h += '<div class="ped-it"><span class="nm">'+pedEsc(p.n)+'</span><span class="pr">$'+Math.round(p.p)+
           '</span><button type="button" onclick="pedMas('+i+',1)">+</button></div>';
    }
    lista.innerHTML = puestos ? h : '<div class="ped-it"><span class="nm">No encontramos ese producto</span></div>';
    var nombres = Object.keys(pedCarro), sub = 0, c = "";
    for (var k=0;k<nombres.length;k++){
      var n = nombres[k], cant = pedCarro[n], imp = pedPrecio(n)*cant; sub += imp;
      c += '<div class="rg"><span>'+cant+' &times; '+pedEsc(n)+'</span><span>$'+Math.round(imp)+
           ' <button type="button" onclick="pedMas('+pedIndice(n)+',-1)">&minus;</button></span></div>';
    }
    var esEnvio = document.getElementById("pedEntrega").value === "envio";
    var env = pedEnvioActual();
    if (!nombres.length) c = '<div class="rg"><span>Todav&iacute;a no elegiste nada</span></div>';
    else {
      if (esEnvio) {
        // El envio se muestra SIEMPRE que sea a domicilio: si es gratis lo dice,
        // y si no, lo cobra. Antes, si el comercio no tenia zonas cargadas, el
        // cliente veia un total sin envio y despues le cobraban de mas.
        c += env > 0
          ? '<div class="rg"><span>Env&iacute;o</span><span>$'+Math.round(env)+'</span></div>'
          : '<div class="rg"><span>Env&iacute;o</span><span class="ped-gratis">gratis</span></div>';
        if (PED_GRATIS_DESDE > 0 && env > 0)
          c += '<div class="rg"><span style="font-size:12.5px;color:#5b6672">Te faltan $'+Math.round(PED_GRATIS_DESDE-sub)+' para el env&iacute;o gratis</span><span></span></div>';
      }
      c += '<div class="ped-tot"><span>Total</span><span>$'+Math.round(sub+env)+'</span></div>';
    }
    document.getElementById("pedCarro").innerHTML = c;
    document.getElementById("pedEnvio").style.display = esEnvio ? "block" : "none";
    pedPintarPago();
  }
  function pedEnviar(){
    var items = [];
    for (var n in pedCarro) items.push({ name: n, qty: pedCarro[n] });
    if (!items.length) return pedAviso("Eleg\u00ed al menos un producto.");
    var nombre = (document.getElementById("pedNombre").value||"").trim();
    var tel = (document.getElementById("pedTel").value||"").trim();
    var entrega = document.getElementById("pedEntrega").value;
    var dir = (document.getElementById("pedDir").value||"").trim();
    var zs = document.getElementById("pedZona");
    if (!nombre) return pedAviso("Pon\u00e9 tu nombre.");
    if (tel.replace(/\D/g,"").length < 6) return pedAviso("Pon\u00e9 un tel\u00e9fono para que te podamos avisar.");
    if (entrega === "envio" && !dir) return pedAviso("Pon\u00e9 la direcci\u00f3n de entrega.");
    if (entrega === "envio" && zs && PED_ZONAS.length && !zs.value) return pedAviso("Eleg\u00ed tu zona, as\u00ed sabemos cu\u00e1nto sale el env\u00edo.");
    var pago = (document.getElementById("pedPago")||{}).value || "";
    var vueltoEl = document.getElementById("pedVuelto");
    var pagaCon = pago === "efectivo" && vueltoEl ? String(vueltoEl.value||"").replace(/\D/g,"").slice(0,9) : "";
    var b = document.getElementById("pedEnviarBtn");
    b.disabled = true; b.textContent = "Mandando\u2026";
    pedAviso("");
    // La forma de pago viaja de DOS maneras a proposito: como dato propio (para
    // los buzones al dia) y como una marca al final de las aclaraciones. Asi
    // funciona igual con un buzon que todavia no se actualizo, sin que el
    // comercio tenga que tocar nada en Cloudflare.
    var marca = "[PAGA: " + pago + (pagaCon ? " con $" + pagaCon : "") + "]";
    // La aclaracion se recorta ANTES, no despues: si no, una nota larga se comia
    // la marca y la forma de pago se perdia sin que nadie se enterara.
    var nota = (document.getElementById("pedNota").value||"").trim().slice(0, 199 - marca.length);
    fetch(PED_URL + "/pedido", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ local: PED_LOCAL, nombre: nombre, telefono: tel, entrega: entrega,
        direccion: dir, items: items,
        nota: ((nota ? nota + " " : "") + marca).slice(0, 200),
        pago: pago, pagaCon: pagaCon,
        zonaId: zs ? zs.value : "" })
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok) {
        document.getElementById("pedPaso1").style.display = "none";
        var extra = (pago === "transferencia" && PED_ALIAS)
          ? " Alias para transferir: " + PED_ALIAS
          : "";
        pedAviso("\u00a1Listo! Tu pedido entr\u00f3 en " + PED_LOCALNOM + ". Te avisamos por WhatsApp cuando est\u00e9 en camino." + extra, "ok");
      } else if (j && j.error === "demasiados-pedidos") {
        b.disabled = false; b.textContent = "Mandar el pedido";
        pedAviso("Hay muchos pedidos en este momento. Prob\u00e1 en un rato o llamanos.");
      } else {
        b.disabled = false; b.textContent = "Mandar el pedido";
        pedAviso("No pudimos mandar el pedido. Prob\u00e1 de nuevo o llamanos.");
      }
    }).catch(function(){
      b.disabled = false; b.textContent = "Mandar el pedido";
      pedAviso("No pudimos mandar el pedido. Revis\u00e1 tu conexi\u00f3n.");
    });
  }
</script>
